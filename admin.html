<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>관리자 · mistall2-beep</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
  :root{--ink:#16191f;--muted:#5b6472;--line:#e7e3da;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:
      radial-gradient(900px 460px at 80% -10%, rgba(232,128,74,.14), transparent 60%),
      radial-gradient(900px 460px at 10% 0%, rgba(31,158,138,.16), transparent 62%),#f3eee4;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:64px 24px 80px}
  .eyebrow{font-size:12.5px;font-weight:800;color:#0f6f60;letter-spacing:.08em;text-transform:uppercase}
  h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.03em;margin:12px 0 10px}
  .lead{color:var(--muted);font-size:16px;max-width:560px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:38px}
  .proj{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:26px;box-shadow:0 2px 6px rgba(40,30,15,.05),0 18px 40px rgba(40,30,15,.08);
    transition:transform .14s ease,box-shadow .2s ease;position:relative;overflow:hidden}
  .proj:hover{transform:translateY(-3px);box-shadow:0 30px 60px rgba(40,30,15,.16)}
  .proj .cover-link{position:absolute;inset:0;z-index:1}
  .proj .ic{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:27px}
  .proj.pl .ic{background:linear-gradient(135deg,#1f9e8a,#e8804a)}
  .proj.ab .ic{background:linear-gradient(135deg,#3056d3,#6f8bff)}
  .proj.lc .ic{background:linear-gradient(135deg,#0f6b5f,#1fae93)}
  .proj.lo .ic{background:linear-gradient(135deg,#3f9b6b,#8fd694)}
  .proj h2{font-size:21px;font-weight:800;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
  .proj h2 .ext{font-size:10.5px;font-weight:800;color:#3f7a55;background:#e6f6ec;border:1px solid #cfe9d7;padding:2px 8px;border-radius:999px}
  .proj p{font-size:14px;color:var(--muted)}
  .proj p code{background:#f2efe7;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
  .proj .tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
  .proj .tags span{font-size:11.5px;font-weight:700;color:#46505f;background:#f2efe7;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
  .proj .go{position:absolute;right:22px;top:26px;color:#c9bfae;font-size:22px}
  .sub-links{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2}
  .sub-links a{font-size:12.5px;font-weight:700;color:#0f6f60;background:#e6f6f2;border:1px solid #cfe9e2;padding:6px 11px;border-radius:999px;text-decoration:none}
  footer{margin-top:46px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:20px}
  .lockbtn{margin-top:12px;display:inline-block;font-family:inherit;font-size:12.5px;font-weight:800;color:#8a5a2a;
    background:#f7ead9;border:1px solid #e7d3ba;border-radius:999px;padding:7px 13px;cursor:pointer}
  code{background:#f2efe7;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}

  /* gate */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gatebox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:34px 30px;box-shadow:0 2px 6px rgba(40,30,15,.05),0 22px 50px rgba(40,30,15,.12);text-align:center}
  .gatebox .lock{font-size:34px}
  .gatebox h2{font-size:20px;font-weight:800;margin:12px 0 4px;letter-spacing:-.02em}
  .gatebox p{font-size:13px;color:var(--muted);margin:0 0 20px}
  .gatebox form{display:flex;flex-direction:column;gap:10px}
  .gatebox input{font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    background:#faf7f0;text-align:center;letter-spacing:.02em}
  .gatebox input:focus{outline:none;border-color:#8fd0c4;background:#fff}
  .gatebox button{font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:#0f6b5f;border:0;
    border-radius:12px;padding:12px 14px;cursor:pointer}
  .gatebox button:hover{background:#0a5147}
  .gatebox .err{color:#b5493f;font-size:12.5px;font-weight:700;height:16px;margin-top:2px}
  .gatebox .note{font-size:11px;color:#9aa39c;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gatebox">
      <div class="lock">🔒</div>
      <h2>관리자 허브</h2>
      <p>이 페이지는 비밀번호로 보호됩니다.</p>
      <form id="f" autocomplete="off">
        <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호"/>
        <button type="submit">열기</button>
        <div class="err" id="err"></div>
      </form>
      <div class="note">권한이 있는 관리자만 접근할 수 있습니다.<br>공개 주소에는 프로젝트 목록이 표시되지 않습니다.</div>
    </div>
  </div>

  <div class="wrap" id="hub" hidden></div>

  const SK = 'admin-hub-pw';
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pw){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(P.s), iterations:150000, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  }
  async function tryUnlock(pw){
    const key = await deriveKey(pw);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.i)}, key, b64d(P.c));
    return new TextDecoder().decode(pt); // throws if wrong password
  }
  function reveal(html){
    document.getElementById('hub').innerHTML = html;
    document.getElementById('hub').hidden = false;
    document.getElementById('gate').style.display = 'none';
  }
  window.lockNow = function(){ sessionStorage.removeItem(SK); location.reload(); };
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    err.textContent = '';
    try{ const html = await tryUnlock(pw); sessionStorage.setItem(SK, pw); reveal(html); }
    catch(_){ err.textContent = '비밀번호가 올바르지 않습니다.'; document.getElementById('pw').select(); }
  });
  // auto-unlock within the same browser session
  (async () => {
    const saved = sessionStorage.getItem(SK);
    if(saved){ try{ reveal(await tryUnlock(saved)); }catch(_){ sessionStorage.removeItem(SK); } }
  })();
</script>
