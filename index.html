<!DOCTYPE html>
<html lang="ko">
<head>

<title>mistall2-beep</title>

<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;

  .mark{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;

    box-shadow:0 10px 26px rgba(31,158,138,.3)}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
  p{color:#5b6472;font-size:14.5px;margin:0}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">🌿</div>
    <h1>비공개 작업 공간</h1>
    <p>이 페이지는 공개된 내용이 없습니다.<br>권한이 있는 경우 안내받은 주소로 접속해 주세요.</p>
  </div>
